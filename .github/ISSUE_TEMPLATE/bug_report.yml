name: Bug report
description: Something crashes, renders wrong, or stopped working.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page URL and what you did, if applicable.
      placeholder: |
        1. Open https://...
        2. Press ...
        3. ...

  - type: input
    id: firmware
    attributes:
      label: OS version
      description: This fork targets the Raspberry Pi Zero 2 W GamerCard exclusively.
      placeholder: e.g. Debian 12 (bookworm) ARM64
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - GamerCard software store
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: retsurf version
      description: Shown in Settings > About.
      placeholder: e.g. 0.9.0, or nightly from 2026-10-01
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag the files here, or paste the relevant part. After a crash, also attach
        `retsurf-panic.log`.
