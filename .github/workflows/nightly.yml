name: Nightly

# One rolling pre-release on the `nightly` tag, rebuilt from main once a day.
# Release assets are public, so the app's nightly channel needs no GitHub token —
# Actions artifacts, which the channel used to read, require auth even here.
#
# This fork targets the Raspberry Pi Zero 2 W GamerCard build exclusively —
# every other platform this workflow used to aggregate (desktop Linux/macOS/
# Windows, Android, the PortMaster and Miyoo per-core matrices) has been
# dropped from this repo; see packaging/pizero2w/README.md.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the last nightly is already this commit"
        type: boolean
        default: false
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: write

# Never two at once: they would race for the tag.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # The published nightly records the commit it was built from, so a quiet
          # day costs nothing. No release yet means there is nothing to compare to.
          last="$(gh release view nightly --json body --jq .body 2>/dev/null \
                  | sed -n 's/^commit: //p' || true)"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced: rebuilding $sha"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$sha" = "$last" ]; then
            echo "no commits since the last nightly ($last)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "building $sha (last was ${last:-none})"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  pizero2w:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-pizero2w.yml

  publish:
    needs: [changed, pizero2w]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: art

      # Asset name must match the release one exactly: the updater asks for a
      # file by name.
      - name: Package
        run: |
          set -eux
          mkdir -p out
          cd art/retsurf-pizero2w && zip -r ../../out/retsurf-pizero2w.zip .
          cd ../..
          sha256sum out/retsurf-pizero2w.zip > out/retsurf-pizero2w.zip.sha256
          ls -la out

      # The tag follows main rather than accumulating one tag per night.
      - name: Move the nightly tag
        run: |
          set -eux
          git tag -f nightly "${{ needs.changed.outputs.sha }}"
          git push origin nightly --force

      # The releases page orders by when a release was created, which neither an
      # edit nor a republish changes; a fresh release keeps the nightly on top.
      - name: Drop the previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes || true

      # prerelease + make_latest keep this out of the way of the stable channel,
      # which picks the highest semver tag and cannot parse `nightly` anyway.
      # Drafted until the asset is up, so the updater never sees a half release.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          draft: true
          prerelease: true
          make_latest: false
          files: out/*
          body: |
            Automated build from the latest commit on main. Expect bugs.

            commit: ${{ needs.changed.outputs.sha }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit nightly --draft=false
