name: Pi Zero 2 W

# The GamerCard handheld: Raspberry Pi Zero 2 W (quad Cortex-A53, 512 MB),
# Debian 12 (bookworm) ARM64. Rendering is GL (`default = ["webgl"]` in
# Cargo.toml) atop Mesa's software rasterizer (`LIBGL_ALWAYS_SOFTWARE=1`,
# packaging/pizero2w/launch.sh) rather than the VideoCore IV's own GPU driver
# (GLES 2.x, below WebRender/egui's GLES 3.0 floor) or this fork's swgl
# `software` feature (its blend-mode dispatch can abort the whole process on
# ordinary page content — see Cargo.toml's `[features]` comment), so a plain
# `cargo build --release` below needs no feature override. See
# packaging/pizero2w/README.md for the device profile this binary ships next to.
on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [published]

# Named by hand: `github.workflow` is the *caller's* name in a called workflow,
# so six callees would share one group and cancel each other out of it.
concurrency:
  group: build-pizero2w-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  build:
    # Nightly builds its own release; publishing it must not start a second build.
    if: github.event_name != 'release' || github.event.release.tag_name != 'nightly'
    # Native arm64 runner, no cross-compile/qemu — same as the PortMaster and
    # universal aarch64 jobs. Unlike those, no `ubuntu:20.04` glibc-floor
    # container: this target is a fixed, known, modern OS (Debian 12 bookworm,
    # glibc 2.36), not a decade of mismatched handheld firmwares, so the
    # runner's own 22.04 (glibc 2.35) is already an older floor than the
    # device, and mozjs_sys's prebuilt SpiderMonkey — built on Ubuntu 22.04 —
    # needs no `MOZJS_FROM_SOURCE` rebuild to match it.
    runs-on: ubuntu-22.04-arm
    env:
      # clang-sys would take the newest libclang on this image, and mozangle's
      # shader bindgen dies on clang 15: it dropped __builtin_ia32_* sat-math.
      LIBCLANG_PATH: /usr/lib/llvm-14/lib
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'release'
        uses: ./.github/actions/verify-version

      - name: Diagnostics
        run: |
          set -eux
          uname -m
          ldd --version | head -1
          nproc
          free -h || true
          df -h /

      - uses: ./.github/actions/linux-build-env

      # The board is a fixed, known quad Cortex-A53, so this build can safely
      # tell rustc that (see packaging/pizero2w/README.md's own build section
      # for the same flag used on-device). No `--features` override: the
      # fork's own default (`["webgl"]`) is already the GL-atop-Mesa-software
      # build this board wants.
      - name: Build
        env:
          RUSTFLAGS: -C target-cpu=cortex-a53
        run: |
          set -eux
          cargo build --release
          df -h /

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/release/retsurf dist/retsurf
          strip dist/retsurf || true
          ls -la dist/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: retsurf-pizero2w-bin
          path: dist/retsurf
          retention-days: 14

      # The binary plus everything packaging/pizero2w/README.md's Install
      # section copies beside it — extract straight into /opt/retsurf/.
      - name: Package for the device
        run: |
          set -eux
          pkg=dist/retsurf-pizero2w
          mkdir -p "$pkg"
          cp dist/retsurf "$pkg/"
          cp packaging/pizero2w/config.toml "$pkg/"
          cp packaging/pizero2w/bindings.toml "$pkg/"
          cp packaging/pizero2w/fonts.conf.in "$pkg/"
          cp packaging/pizero2w/retsurf.desktop "$pkg/"
          cp packaging/pizero2w/launch.sh "$pkg/" && chmod +x "$pkg/launch.sh"
          ls -la "$pkg"

      - name: Upload device package artifact
        uses: actions/upload-artifact@v7
        with:
          name: retsurf-pizero2w
          path: dist/retsurf-pizero2w
          retention-days: 14

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          cd dist/retsurf-pizero2w && zip -r ../../retsurf-pizero2w.zip .
          cd ../..
          # Not consulted by retsurf's own in-app updater at all: this board's
          # updates come from the console's own software store, which installs
          # a `.deb` it builds separately — see packaging/pizero2w/README.md's
          # "Updates" section. Shipped anyway for manual verification and as a
          # build artifact the store's packaging step can pull from.
          sha256sum retsurf-pizero2w.zip > retsurf-pizero2w.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            retsurf-pizero2w.zip
            retsurf-pizero2w.zip.sha256
