[package]
name = "retsurf-android"
version = "0.9.0"
edition = "2021"
license = "GPL-3.0"
publish = false

# Its own crate rather than a second crate-type on the main package: the armhf
# build links non-PIC objects (`relocation-model=static`), which no shared object
# can be made of, so that build must not produce one at all.
[lib]
name = "retsurf" # SDL's Java shell dlopens `libretsurf.so` by this name
crate-type = ["cdylib"]

[dependencies]
# `default-features = false, features = ["webgl"]`: the root Cargo.toml's
# default flipped to `["software"]` for the Pi Zero 2 W fork (CPU-only by
# default — that board has no GPU path worth spending RAM on). Android phones/
# tablets have a real GPU (Mali/Adreno/PowerVR) and no CPU-fallback build of
# this app exists for them, so the dependency pins webgl back explicitly
# rather than silently inheriting whatever the root manifest defaults to.
retsurf = { path = "../..", default-features = false, features = ["webgl"] }
