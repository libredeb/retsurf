# Default retsurf.toml for the Raspberry Pi Zero 2 W target (4x Cortex-A53,
# 512 MB total RAM shared with the VideoCore GPU's carve-out) driving a
# Pimoroni HyperPixel 4.0 Square (720x720, no touch, no window manager).
#
# Stages 1 (resource trim) and 2 (720x720 square compositing) of the
# pizero2w refactor — see packaging/pizero2w/README.md. Stage 3 (the forced
# size-optimized build profile) lives in Cargo.toml, not here.

[display]
# The panel's native resolution, exactly — see README.md for why the chrome
# needs no device-specific scaling override to look right at this size.
width = 720
height = 720
# This board runs labwc (a real Wayland compositor), not a bare KMS/DRM kiosk
# boot — a window manager capable of resizing this window genuinely exists
# here. `lock_size` is what keeps the layout viewport the pages see
# (window.innerWidth/innerHeight) pinned to 720x720 regardless, whether the
# custom launcher, a labwc keybind, or an on-device debugging session tries
# to drag it elsewhere. See README.md's compositing section for the detail.
lock_size = true

[browser]
# A second tab is a second engine's worth of memory on a device with none to
# spare: Servo keeps a full script/layout/JS-heap stack per open tab.
max_tabs = 1

[controls]
# The nav disc aims the cursor linearly by default (speed = deflection *
# cursor_speed, same on every device) — fine for crossing the screen, coarse
# for stopping exactly on a small link, especially on a short-throw disc
# instead of a long-throw thumbstick. Quadratic easing (2.0) keeps full
# deflection at the same top speed while making a small push move the cursor
# much more slowly, for the same reason a mouse's own pointer acceleration
# exists. Tune live in Settings > Controls > "Cursor precision" if 2.0 isn't
# the right feel on the actual nav disc.
cursor_curve = 2.0
# Hint mode's combo badges exist to be pressed via a direct D-pad-button
# letter select (src/app/router.rs's `DpadPress`) — gone now that launch.sh's
# SDL_GAMECONTROLLERCONFIG no longer synthesizes D-pad buttons off this
# board's single nav-disc axes (see its own comment: that synthesis is what
# was saturating the cursor's aim vector and defeating cursor_curve above).
# Off here so hint mode falls back to plain spatial hopping via the stick,
# which still works exactly as before, instead of showing badges with a
# letter nothing on this board can press.
hint_badges = false

[osk]
# The grid keyboard's own layout (src/ui/osk/mod.rs's ROW_SPAN) is a design
# sized for a 640-wide chrome, narrower than this 720px square panel even at
# zoom 1.0 — this stretches every key, gap and badge uniformly to fill the
# panel instead, so the keys are bigger and easier to land on with the nav
# disc. Off by default everywhere else, where the design already matches the
# window it's built for.
full_width = true

[update]
# src/update's install-kind detection has no case for this board yet: any
# writable-directory linux/aarch64 install reads as `Kind::Single` and points
# at `retsurf-linux-aarch64.zip` — the generic, GPU-featured (`webgl`)
# universal build CI makes for desktop-style aarch64, not this board's own
# CPU-only `retsurf-pizero2w.zip`. An in-place "update" would swap this
# board's binary for one that doesn't match its Cargo features at all. Off
# until src/update gains a pizero2w-specific Kind (a sibling-file check like
# PortMaster's own `portmaster_paths()`) pointed at the right asset — see
# packaging/pizero2w/README.md.
auto_check = false

[performance]
# `auto` already resolves 512 MB into this tier (src/browser/memory.rs,
# 257-768 MB -> `embedded`), but pinned explicitly so an SoC reporting a
# slightly different MemTotal after the GPU's memory split can't silently
# land on a neighboring tier. `embedded` alone already gives: 1 layout/worker
# thread, a 64 MB JS heap with the most eager GC thresholds short of `micro`,
# no in-memory or on-disk HTTP cache, grayscale-only text AA, and every
# optional DOM subsystem (WebXR, Bluetooth, service/shared workers, worklets,
# accessibility) off.
memory_profile = "embedded"
# Needs the scaling_governor sysfs files writable (root, or a udev rule);
# silently skipped with a log line otherwise. Measured -16% page load time on
# comparable in-order Cortex-A cores (see src/config/performance.rs).
cpu_boost_on_load = true
# 0 = keep the `embedded` tier's own counts (1 everywhere). RAM, not the 4
# A53 cores, is what 512 MB binds first; raise to 2 only if your own image's
# profiling shows headroom to spend a second core on layout/WebRender.
layout_threads = 0
worker_pool_max = 0
# No on-disk HTTP cache: writes would land on the SD/eMMC card for a budget
# `embedded` already spends on no in-memory cache at all
# (network_http_cache_disabled, set by the tier itself).
http_disk_cache_mb = 0
# Pinned on purpose, not left at the engine's own default (also 30): the
# HyperPixel panel's spec sheet advertises 60fps, which reads as "this should
# be 60" — but every frame here is a full-panel CPU recomposite (this fork's
# only rendering path, no GPU compositor pass to amortize it), so
# doubling to 60 doubles that cost for a kiosk-style browser UI, not a twitch
# game, on a 1600 mAh battery. Raise only after measuring battery life and
# frame cost on an actual unit, not from the spec sheet alone.
max_fps = 30

[data_saving]
# Servo decodes every <img> up front — no lazy loading — and keeps the decoded
# bitmap resident for as long as the DOM node lives; there is no byte-sized
# image-cache preference to set directly (see the module docs in
# src/browser/memory.rs). Count is the real lever available: at the ~0.75
# MB/image resident cost measured on the Miyoo Mini port
# (packaging/miyoo/shared/config.toml, 87 MB -> 9 MB at a cap of 12), 40
# images keeps a single page's own decoded-image memory under ~30 MB, leaving
# the 64 MB JS heap and layout/WebRender their own room underneath the
# `embedded` tier's ceiling.
max_images_per_page = 40
