[package]
name = "retsurf"
version = "0.9.0"
edition = "2021"
license = "GPL-3.0"

[lib]
name = "retsurf"
crate-type = ["lib"]

# PIZERO2W FORK: this fork targets exactly one board (Raspberry Pi Zero 2 W +
# HyperPixel 4.0 Square) with no GPU-accelerated EGL/GLES path worth carrying —
# the VideoCore IV's shared-memory GL path costs unified RAM this device has
# none of spare, on a panel too small for the difference to be visible. Upstream
# offered a GL/WebGL chrome backend (behind a `webgl` feature) alongside this
# software one (`swgl` rasterizes the page, SDL's own renderer paints the
# chrome); both the feature and the GL backend it gated (`servo/webgl`, the
# EGL/surfman composite path, `android/` — Mali/Adreno/PowerVR all need real
# GLES, which this fork no longer carries at all) were removed once the
# pizero2w-only scope made them dead weight, rather than kept as a toggle
# nothing here ever flips. `cargo build --release` is now always this one,
# single rendering path, even though swgl compiles every WebRender shader as
# C++ — the one GPU-bearing target upstream carried the GL path for is not this
# fork's target.

# This fork targets exactly one board (the Raspberry Pi Zero 2 W GamerCard;
# every other platform — desktop Linux/macOS/Windows, Android, the PortMaster
# and Miyoo per-core matrices — has been dropped from this repo, see
# packaging/pizero2w/README.md), so unlike upstream retsurf, which kept fat
# LTO / codegen-units=1 / panic=abort CI-only (CARGO_PROFILE_RELEASE_* env
# vars in its workflows) so a contributor's local `cargo build --release`
# stayed fast across six platforms, there is no "fast local release build"
# worth keeping here: every `cargo build --release` on this tree should
# produce the same binary `build-pizero2w.yml` would. `panic = "abort"`
# matches what upstream already sets for every *embedded* per-device build
# (Miyoo's armhf, the arm64 per-core handheld binaries) — upstream only kept
# `unwind` on its generic desktop-style Linux install, so a Servo worker's
# panic there would not take a desktop install down with it. A single-purpose
# kiosk board gets no benefit from that resilience (there is no session to
# save a crashing tab out of) and every byte of unwind-table is one this
# device doesn't have spare; a panic still writes `RETSURF_PANIC_FILE` before
# the process exits (src/lib.rs), so field failures stay diagnosable.
[profile.release]
# Aggressive size over speed, per spec: `z` typically costs a few percent more
# CPU per frame than `s` for a bit more size shaved. Upstream's own armhf CI
# build (the Miyoo Mini, the weakest CPU in this tree) measured that tradeoff
# and chose `s` (see .github/workflows/build-linux-armhf.yml) — the Pi Zero
# 2 W's four A53s have more headroom than the Mini's dual in-order A7s, which
# is the only reason `z` is a reasonable ask here rather than a frame-time
# regression. If `[debug] frame_timing` shows the software compositor missing
# its budget, drop this back to `"s"` first before touching anything else.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
# `strip` is for local builds, which have no strip step of their own and would
# otherwise ship symbols. The other two are release defaults, pinned so every
# build matches.
strip = true
debug-assertions = false
overflow-checks = false

# The rasterizers stay at -O3 even under a `z`-everywhere release profile: they
# are the frame, and scalar swgl — the only path this fork rasterizes through —
# is not something to make slower in exchange for a smaller .text. Unchanged
# from upstream (see tools/armhf/build.sh), which needed the same exception for
# the same reason on a weaker CPU.
[profile.release.package.swgl]
opt-level = 3
[profile.release.package.webrender]
opt-level = 3
[profile.release.package.webrender_api]
opt-level = 3

[dependencies]
rust-embed="8.7.2"
rustls = {version = "0.23.32", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
sdl2 = { version = "0.38.0", default-features = false }
gleam = "0.15"
glow = "0.17"
surfman = "0.14"
# WebRender's own software rasterizer — this fork's only rendering path. Same
# 0.70 as the `webrender` already in the graph — WR switches to its software
# paths on the renderer name alone, so the two must be one release.
swgl = "0.70"
log = "0.4.28"
env_logger = "0.11.8"
# Named off the fork rather than a version plus a patch: no such version is on
# crates.io, and deps.rs reads that as unresolvable. bundled_freetype, since
# freetype-sys otherwise outgrows CI's system FreeType; webcrypto gates `window.crypto`.
servo = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0", default-features = false, features = ["bundled_freetype", "clipboard", "gamepad", "js_jit", "webcrypto"] }
# Servo hands us its memory report (profile_traits::mem::MemoryReportResult) through
# servo_base's GenericCallback. Same version as `servo`, so Cargo unifies on one copy.
servo-base = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0" }
# WebAudio (src/media): our SDL2 backend in place of Servo's silent dummy. Must resolve
# to the fork like `servo` does, or it registers into a second copy of these crates.
servo-media = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0" }
servo-media-dummy = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0" }
# `decodeAudioData` (src/media/decoder.rs). Pure Rust, so it cross-compiles to the
# handhelds; the enabled containers/codecs are what pages actually hand us. `opt-simd` is
# left off: it pulls rustfft in for a decode that runs once per file, off the render thread.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "aac", "isomp4", "id3v2"] }
# Files come at their own rate, `AudioBuffer` wants the context's. Polynomial resampling
# (no `fft_resampler`, so no FFT crates) is rubato's cheap end, which beats transition-band
# purity on an A35.
rubato = { version = "5", default-features = false }
# `<video>` decode (src/media/video.rs): Cisco's OpenH264, built from source via cc
# because it cross-compiles with a plain toolchain where dav1d and libvpx want meson.
openh264 = "0.9.8"
# Decoded YUV 420 -> the BGRA8 WebRender wants. SIMD paths (NEON/SSE) are its default
# features; the conversion runs once per displayed frame.
yuv = "0.8"
euclid = "0.22"
dpi = "0.1.2"
url = "2.5.7"
percent-encoding = "2.3"
# Matches the version servo-embedder-traits uses, so HeaderMap/StatusCode values
# we build for intercepted responses (the built-in start page) are the same type.
http = "1"
# Downloads are the embedder's job: Servo has no download API, still true on `main`.
# ureq is blocking (one thread per download) and bundles webpki roots, so TLS works
# on handhelds without a system CA store.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Ad blocking: Brave's engine (EasyList syntax), driven from Servo's
# load_web_resource hook. content-security-policy must track Servo's version:
# two copies of its Destination do not interoperate.
adblock = "0.13"
content-security-policy = "0.9"
keyboard-types = "0.8.1"
# Rebindable input: the gesture machine, `bindings.toml` and the editor model. Its
# `sdl2` feature resolves to the same sdl2 as ours, so pad and key types are one set.
inputbind = { git = "https://github.com/mxmgorin/inputbind", rev = "e33376b103bc49ea450eec54c251dfcdb251eb8b" }
# Draws the chrome: egui over SDL2. `canvas-backend` is the CPU half — this
# fork's only one; `glow-backend` (the GPU half, upstream's default) went with
# the GL chrome backend once the pizero2w-only scope made it dead weight.
egui-sdl2 = { version = "0.12.0", default-features = false, features = ["canvas-backend"] }
# Every chrome icon comes from this font: `bold` because lighter weights wash out at
# the 15px the handhelds draw, `fill` for the solid halves of on/off pairs. From the
# fork because upstream's newest release is still on egui 0.35, and two do not mix.
egui-phosphor = { git = "https://github.com/mxmgorin/egui-phosphor", rev = "2450b628806faca64859caae129972852216c2b1", default-features = false, features = ["bold", "fill"] }
sdl2-keyboard-types = "0.1.0"
# Decodes the bundled window-icon PNG at startup for SDL's set_icon. Pinned to the
# version already in the tree (pulled in via servo), so it adds no new resolve.
png = "0.18"
# Rasterizes the start page's banner SVG. The version and features Servo already
# builds, so it adds nothing to the tree.
resvg = "0.48.1"
# Decoding files a page hands us as base64 over `evaluate_javascript`
# (src/browser/blob_download.rs). Already in the tree via servo.
base64 = "0.23"

# In-app self-update (src/update); serde_json also parses blob-capture payloads. `zip`
# is the one crate new to the tree, and its flate2 backend keeps ARM cross-builds C-free.
serde_json = "1"
sha2 = "0.11"
semver = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Local game folders (src/browser/local_site.rs); all in the tree via servo's net.
mime_guess = "2"
flate2 = "1"
brotli-decompressor = "5"

[dev-dependencies]
# local_site's brotli fixtures; in the tree via servo's net.
brotli = "8"

# Android: SDL loads our cdylib and calls the C `SDL_main` we export. Logs go to
# logcat via android_logger since there is no stderr to mirror to a file.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

# The engine is our Servo fork: upstream `main` plus our commits, on a new branch per
# sync (`retsurf-main-<minor>-<upstream>`), pinned by tag. Our diff against upstream:
# https://github.com/servo/servo/compare/main...mxmgorin:servo:<tag>
[patch.crates-io]
# Every entry names the same source: the Servo crates depend on each other by path,
# so a mixed graph ends up with two of every crate. Catches transitive refs only.
servo = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0" }
servo-base = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0" }
servo-media = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0" }
servo-media-dummy = { git = "https://github.com/mxmgorin/servo", tag = "retsurf-main-0.10.0" }
# Our surfman: upstream asks eglChooseConfig for a desktop-GL config unconditionally,
# which no Mali blob has, and loads core GL only through eglGetProcAddress, which
# EGL 1.4 blobs (PowerVR) answer with null. Graph-wide, so Servo resolves to the same copy.
surfman = { git = "https://github.com/mxmgorin/surfman", tag = "retsurf-main-0.10.0" }
